name: Tests
on:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    name: Windows checks
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14.4'
          cache: 'pip'
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: 'npm'
      - name: Install FFmpeg (Windows)
        run: choco install ffmpeg --no-progress -y
      - name: Check installer (Windows)
        shell: pwsh
        run: ./scripts/install.ps1 -Check
      - name: Install dependencies (Windows)
        shell: pwsh
        run: ./scripts/install.ps1
      - name: Install quality tooling
        run: python -m pip install -r requirements-dev.txt
      - name: Exercise PowerShell launcher
        shell: pwsh
        run: ./scripts/playwright.ps1 --version
      - run: ruff check .
      - run: ruff format --check .
      - run: pyright
      - run: python -m unittest discover -s tests -v
      - name: Check the skill mirror is in sync
        run: python scripts/gen_skill_mirror.py --check
      - name: Check Bash scripts
        shell: bash
        run: find scripts -type f -name '*.sh' -print0 | xargs -0 -n1 bash -n
      - name: Check PowerShell scripts
        shell: pwsh
        run: pwsh -NoProfile -Command "[scriptblock]::Create((Get-Content -Raw scripts/check.ps1)) | Out-Null"
      - run: node --check assets/storyboard.js
      - run: node --check assets/review.js
