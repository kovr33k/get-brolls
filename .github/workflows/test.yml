name: Tests
on:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    name: Windows checks
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.14.4'
          cache: 'pip'
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: 'npm'
      - name: Install FFmpeg (Windows)
        shell: pwsh
        run: |
          # Gyan's release mirror is linked from ffmpeg.org; keep the archive and checksum pinned together.
          $archive = Join-Path $env:RUNNER_TEMP 'ffmpeg-9.0.2.zip'
          $target = Join-Path $env:RUNNER_TEMP 'ffmpeg-9.0.2'
          Invoke-WebRequest -Uri 'https://github.com/GyanD/codexffmpeg/releases/download/9.0.2/ffmpeg-9.0.2-essentials_build.zip' -OutFile $archive -TimeoutSec 180
          $expected = '60f467265b1e312373dbcd92200c2618a74850f98d3d078e94296bb3fa2047ba'
          if ((Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash -ne $expected) { throw 'FFmpeg archive checksum mismatch' }
          Expand-Archive -LiteralPath $archive -DestinationPath $target
          $bin = Join-Path $target 'ffmpeg-9.0.2-essentials_build/bin'
          Get-Item -LiteralPath (Join-Path $bin 'ffmpeg.exe'), (Join-Path $bin 'ffprobe.exe') -ErrorAction Stop | Out-Null
          $bin >> $env:GITHUB_PATH
      - name: Check installer (Windows)
        shell: pwsh
        run: ./scripts/install.ps1 -Check
      - name: Install dependencies (Windows)
        shell: pwsh
        run: ./scripts/install.ps1
      - name: Install quality tooling
        run: python -m pip install -r requirements-dev.txt
      - name: Exercise PowerShell launcher
        shell: pwsh
        run: ./scripts/playwright.ps1 --version
      - run: ruff check .
      - run: ruff format --check .
      - run: pyright
      - run: python -m unittest discover -s tests -v
      - name: Check the skill mirror is in sync
        run: python scripts/gen_skill_mirror.py --check
      - name: Check Bash scripts
        shell: bash
        run: find scripts -type f -name '*.sh' -print0 | xargs -0 -n1 bash -n
      - name: Check PowerShell scripts
        shell: pwsh
        run: Get-ChildItem scripts -Filter *.ps1 | ForEach-Object { [scriptblock]::Create((Get-Content -Raw -LiteralPath $_.FullName)) | Out-Null }
      - run: node --check assets/storyboard.js
      - run: node --check assets/review.js
      - name: Record verified checkout
        id: evidence
        run: python scripts/preflight.py --record-ci "${{ runner.temp }}/verification.json" --github-output "$env:GITHUB_OUTPUT"
      - name: Save Windows verification evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: windows-verification-${{ steps.evidence.outputs.tree }}
          path: ${{ runner.temp }}/verification.json
          if-no-files-found: error
          overwrite: true
